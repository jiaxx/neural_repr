
# environment-cpu.yml 
# CPU-only version for machines without CUDA

name: neural-repr-learning-cpu
channels:
  - pytorch
  - conda-forge
  - defaults

dependencies:
  # Core Python
  - python=3.9
  
  # PyTorch ecosystem (CPU only)
  - pytorch-cpu>=1.12.0
  - torchvision-cpu
  - torchaudio-cpu
  
  # Core scientific computing
  - numpy>=1.21.0
  - scipy>=1.7.0
  - pandas>=1.3.0
  - scikit-learn>=1.0.0
  
  # Plotting and visualization
  - matplotlib>=3.5.0
  - seaborn>=0.11.0
  - plotly>=5.0.0
  
  # Jupyter environment
  - jupyter
  - notebook
  - ipywidgets
  - tqdm
  
  # Additional ML/analysis tools
  - umap-learn
  - statsmodels
  
  # Development tools
  - pytest
  - black
  - isort
  
  # Pip packages
  - pip
  - pip:
    - tensorboard
    - wandb
    - hdbscan
    - phate