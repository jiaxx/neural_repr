# environment.yml
# Conda environment for Neural Representation Learning Package

name: neural-repr-learning
channels:
  - pytorch
  - conda-forge
  - defaults

dependencies:
  # Core Python
  - python=3.9
  
  # PyTorch ecosystem (with CUDA support)
  - pytorch>=1.12.0
  - torchvision
  - torchaudio
  - pytorch-cuda=11.8  # Remove this line if you don't have CUDA
  
  # Core scientific computing
  - numpy>=1.21.0
  - scipy>=1.7.0
  - pandas>=1.3.0
  - scikit-learn>=1.0.0
  
  # Plotting and visualization
  - matplotlib>=3.5.0
  - seaborn>=0.11.0
  - plotly>=5.0.0
  
  # Jupyter environment
  - jupyter
  - notebook
  - ipywidgets
  - tqdm
  
  # Additional ML/analysis tools
  - umap-learn
  - statsmodels
  
  # Development tools
  - pytest
  - black
  - isort
  
  # Pip packages (not available in conda)
  - pip
  - pip:
    - tensorboard
    - wandb  # For experiment tracking (optional)
    - hdbscan  # Advanced clustering (optional)
    - phate  # Dimensionality reduction (optional)
